name: Microsandbox Go Runtimes

# Native VM qualification remains separate from these unit and contract tests.

on:
  pull_request:
    paths:
      - 'tools/microsandbox-pods/**'
      - 'tools/microsandbox-host/**'
      - 'tools/microsandbox-runtime/**'
      - 'src/main/resources/docker/network-helper.Dockerfile'
      - '.github/workflows/microsandbox-pods.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/microsandbox-pods/**'
      - 'tools/microsandbox-host/**'
      - 'tools/microsandbox-runtime/**'
      - 'src/main/resources/docker/network-helper.Dockerfile'
      - '.github/workflows/microsandbox-pods.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.module }} race tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - microsandbox-runtime
          - microsandbox-host
          - microsandbox-pods
          - microsandbox-pods/qualification/awsidentity
          - microsandbox-pods/qualification/applicationgraph
    defaults:
      run:
        working-directory: tools/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/${{ matrix.module }}/go.mod
          cache-dependency-path: |
            tools/microsandbox-pods/go.sum
            tools/microsandbox-host/go.sum
            tools/microsandbox-runtime/go.sum
            tools/microsandbox-pods/qualification/awsidentity/go.sum
            tools/microsandbox-pods/qualification/applicationgraph/go.sum

      - name: Run unit tests with the race detector
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check managed setup and qualification ownership
        if: matrix.module == 'microsandbox-pods'
        run: python3 -m unittest discover -p 'test_*.py'

      - name: Build the stock network test helper
        if: matrix.module == 'microsandbox-pods'
        run: docker build -f ../../src/main/resources/docker/network-helper.Dockerfile -t floci/network-helper:local ../..

      - name: Verify protected peer egress after Service translation
        if: matrix.module == 'microsandbox-pods'
        env:
          FLOCI_TEST_DOCKER_ENVIRONMENT: '1'
        run: go test -race -run '^TestDockerEnvironmentPeerEgressBeforeSourceNAT$' -count=1 .
