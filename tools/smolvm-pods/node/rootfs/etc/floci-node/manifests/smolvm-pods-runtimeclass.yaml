# Pods with runtimeClassName: smolvm-pods run in smolvm microVMs. The overhead
# is 0 so that sleeping pods hold no node resources beyond their requests.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: smolvm-pods
handler: smolvm-pods
overhead:
  podFixed:
    cpu: "0"
    memory: "0"
