[package]
name = "smolvm-pods"
version = "0.1.0"
edition = "2021"
description = "containerd shim v2 (io.containerd.smolvm-pods.v2) that runs each Kubernetes pod in a smolvm microVM"
license = "Apache-2.0"
publish = false
# tests/ holds the end-to-end suites, which are not Cargo integration tests.
autotests = false

[workspace]
exclude = ["node", "tests"]

[[bin]]
name = "containerd-shim-smolvm-pods-v2"
path = "src/main.rs"

# The binary only runs on Linux nodes. On other hosts it compiles to a stub.
[target.'cfg(target_os = "linux")'.dependencies]
containerd-shim = { version = "0.11", features = ["async"] }
containerd-shim-protos = { version = "0.11", features = ["async"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal", "process"] }
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The node service's API (src/api.rs). smolvm's lock has it already.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
nix = { version = "0.27", features = ["sched", "fs", "net"] }
# Each of these is in smolvm's lock already, so none adds a crate to the build.
# smoltcp: the catcher's frames and the probe responder. rustls and rcgen: the
# HTTPS responder's self-signed certificate, and the API server and HTTPS probe
# clients. hyper and the rest: the pod watch and the pre-sleep probe checks
# (HTTP/1.1, and h2c for gRPC). url: the probe checks' redirect Locations.
smoltcp = { version = "0.13", default-features = false, features = ["std", "log", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
smolvm = { path = "../../../smolvm" }
smolvm-pack = { path = "../../../smolvm/crates/smolvm-pack" }
smolvm-protocol = { path = "../../../smolvm/crates/smolvm-protocol" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
# The tests' API servers, and their certificates in PEM.
hyper = { version = "1", features = ["server"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Profiles match smolvm's, so the binary is built the same way as its shim,
# but a panic unwinds: the front shim fails only the request that panicked,
# because its end would end every pod. The VM process aborts at a panic (see
# panics.rs).
[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# smolvm expands its disk templates, 30 GiB of mostly zeros, with these crates.
# At opt-level "z" that takes about 40 seconds on a new node, and 15 at 3.
[profile.release-small.package.smolvm-pack]
opt-level = 3

[profile.release-small.package.zstd]
opt-level = 3

[profile.release-small.package.zstd-safe]
opt-level = 3

[profile.release-small.package.zstd-sys]
opt-level = 3
